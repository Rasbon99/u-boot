name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '19 18 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies for U-Boot build
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex libssl-dev \
          libncurses5-dev libncursesw5-dev python3-dev swig libpython3-dev \
          pkg-config u-boot-tools device-tree-compiler libsdl1.2-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        packs: ./codeql-uboot

    - if: matrix.build-mode == 'manual'
      name: Manual build for U-Boot
      run: |
        make sandbox_defconfig
        make DTC_NO_YACC=1 -j$(nproc)

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
